<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日報ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFEEE6;
    --card: #FFFFFF;
    --ink: #262420;
    --ink-soft: #6B6659;
    --navy: #1F3A5F;
    --navy-deep: #16293F;
    --brass: #A8802E;
    --line: #D8D2BF;
    --danger: #9B4030;
    --alert-bg: #FBEFEA;
    --alert-line: #D9A98C;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    line-height: 1.7;
    background-image: linear-gradient(var(--line) 1px, transparent 1px);
    background-size: 100% 2.1em;
    background-position: 0 5.4em;
  }

  .app { max-width: 560px; margin: 0 auto; padding: 28px 20px 60px; }

  header.app-header {
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 2px solid var(--navy);
    padding-bottom: 14px; margin-bottom: 24px;
  }
  .header-mark {
    font-family: 'Shippori Mincho', serif; font-weight: 700;
    font-size: 1.5rem; color: var(--navy-deep); letter-spacing: 0.04em;
  }
  .header-sub { font-size: 0.78rem; color: var(--ink-soft); }

  section.card {
    background: var(--card); border: 1px solid var(--line);
    border-left: 4px solid var(--navy);
    padding: 20px 18px; margin-bottom: 24px;
  }
  section.card h3 {
    font-family: 'Shippori Mincho', serif; font-size: 1rem;
    margin: 0 0 14px; color: var(--navy-deep);
  }

  .alert-box {
    background: var(--alert-bg);
    border: 1px solid var(--alert-line);
    border-left: 4px solid var(--danger);
    padding: 14px 16px;
    margin-bottom: 24px;
  }
  .alert-box h3 {
    font-family: 'Shippori Mincho', serif; font-size: 0.98rem;
    margin: 0 0 10px; color: var(--danger);
  }
  .alert-item {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; padding: 8px 0; border-top: 1px solid var(--alert-line);
  }
  .alert-item:first-of-type { border-top: none; }
  .alert-text { font-size: 0.9rem; }
  .alert-text .cust { font-weight: 700; color: var(--navy-deep); }
  .alert-done-btn {
    flex-shrink: 0; background: none; border: 1px solid var(--danger);
    color: var(--danger); font-size: 0.75rem; padding: 4px 10px;
    cursor: pointer; border-radius: 2px;
  }

  label.field-label { display: block; font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 6px; }

  textarea, input[type="text"], input[type="date"], select {
    width: 100%; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 1rem;
    color: var(--ink); background: #FBFAF6; border: 1px solid var(--line);
    padding: 10px 12px; border-radius: 2px;
  }
  textarea { resize: vertical; min-height: 140px; }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--navy); outline-offset: 1px; }

  .btn-primary, .btn-save {
    display: inline-block; margin-top: 14px; background: var(--navy); color: #FBFAF6;
    border: none; padding: 11px 22px; font-size: 0.95rem;
    font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 500; cursor: pointer;
    letter-spacing: 0.02em;
  }
  .btn-primary:hover, .btn-save:hover { background: var(--navy-deep); }
  .btn-primary:disabled { background: #A9A79C; cursor: default; }

  .btn-text {
    display: inline-block; margin-top: 14px; margin-left: 10px; background: none;
    border: none; color: var(--ink-soft); text-decoration: underline; cursor: pointer;
    font-size: 0.9rem; font-family: 'Zen Kaku Gothic New', sans-serif;
  }

  .status { margin-top: 10px; font-size: 0.85rem; color: var(--ink-soft); min-height: 1.2em; }
  .status.error { color: var(--danger); }

  .field-block { margin-bottom: 16px; }
  .two-col { display: flex; gap: 12px; }
  .two-col > div { flex: 1; }

  ul.editable-list { list-style: none; margin: 0; padding: 0; }
  ul.editable-list li { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  ul.editable-list li::before { content: "・"; color: var(--brass); flex-shrink: 0; }
  ul.editable-list input { flex: 1; }
  .remove-line { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 0.85rem; flex-shrink: 0; }
  .add-line { background: none; border: none; color: var(--navy); cursor: pointer; font-size: 0.85rem; padding: 4px 0; text-decoration: underline; }

  .suggestion-list { list-style: none; margin: 0; padding: 0; }
  .suggestion-list li {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: #F5F2E9; border: 1px dashed var(--brass);
    padding: 8px 10px; margin-bottom: 8px; font-size: 0.9rem;
  }
  .suggestion-add-btn {
    flex-shrink: 0; background: none; border: 1px solid var(--brass); color: var(--brass);
    font-size: 0.75rem; padding: 3px 9px; cursor: pointer; border-radius: 2px;
  }
  .suggestion-add-btn.added { opacity: 0.4; pointer-events: none; }

  .hidden { display: none !important; }

  .history-section h2 {
    font-family: 'Shippori Mincho', serif; font-size: 1.1rem; color: var(--navy-deep);
    margin: 0;
  }
  .view-toggle-row {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 16px;
    flex-wrap: wrap; gap: 8px;
  }
  .view-toggle { display: flex; gap: 6px; }
  .view-toggle-btn {
    background: var(--card); border: 1px solid var(--line); color: var(--ink-soft);
    font-size: 0.78rem; padding: 5px 10px; cursor: pointer; border-radius: 2px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
  }
  .view-toggle-btn.active { background: var(--navy); border-color: var(--navy); color: #FBFAF6; }

  .date-folder { background: var(--card); border: 1px solid var(--line); margin-bottom: 12px; }
  .date-folder summary {
    padding: 12px 16px; cursor: pointer; font-weight: 500;
    display: flex; justify-content: space-between; align-items: center; list-style: none;
  }
  .date-folder summary::-webkit-details-marker { display: none; }
  .date-folder summary .date-title { color: var(--navy-deep); }
  .date-folder summary .date-count {
    font-size: 0.75rem; color: var(--ink-soft); background: var(--paper);
    border: 1px solid var(--line); padding: 1px 8px; border-radius: 10px;
  }
  .date-entry-cust {
    font-size: 0.82rem; font-weight: 700; color: var(--brass); margin-bottom: 4px;
  }
  .empty-note { color: var(--ink-soft); font-size: 0.9rem; padding: 10px 0; }

  details.customer-folder { background: var(--card); border: 1px solid var(--line); margin-bottom: 12px; }
  details.customer-folder summary {
    padding: 12px 16px; cursor: pointer; font-weight: 500;
    display: flex; justify-content: space-between; align-items: center; list-style: none;
  }
  details.customer-folder summary::-webkit-details-marker { display: none; }
  details.customer-folder summary .cust-name { color: var(--navy-deep); }
  details.customer-folder summary .cust-count {
    font-size: 0.75rem; color: var(--ink-soft); background: var(--paper);
    border: 1px solid var(--line); padding: 1px 8px; border-radius: 10px;
  }

  .entry-item { padding: 12px 16px; border-top: 1px solid var(--line); }
  .entry-top-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .entry-date { font-size: 0.78rem; color: var(--brass); font-weight: 500; margin-bottom: 6px; }
  .entry-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .tag {
    font-size: 0.72rem; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--ink-soft);
  }
  .tag.stage { border-color: var(--navy); color: var(--navy-deep); }
  .tag.temp-good { border-color: #4C7A4C; color: #395c39; }
  .tag.temp-warn { border-color: var(--danger); color: var(--danger); }
  .entry-summary { margin-bottom: 8px; }
  .entry-sub-label { font-size: 0.75rem; color: var(--ink-soft); margin-top: 8px; }
  .entry-item ul { margin: 4px 0 0; padding-left: 1.1em; }
  .entry-item li { margin-bottom: 3px; }
  .delete-entry {
    margin-top: 10px; background: none; border: none; color: var(--danger);
    font-size: 0.78rem; cursor: pointer; text-decoration: underline; padding: 0;
  }
</style>
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="header-mark">日報ノート</div>
    <div class="header-sub">お客様ごとの商談メモ</div>
  </header>

  <section id="alert-section" class="hidden"></section>

  <section class="card">
    <h3>今日の商談メモ</h3>
    <label class="field-label" for="raw-input">音声入力のマイクボタンで話すか、文字起こしをそのまま貼り付けてください</label>
    <textarea id="raw-input" placeholder="例：〇〇商事の田中さんと訪問。新商品の見積もりを来週までに送る約束。予算は50万円くらいとのこと。"></textarea>
    <div><button id="summarize-btn" class="btn-primary">まとめる</button></div>
    <div id="status-msg" class="status"></div>
  </section>

  <section id="draft-card" class="card hidden">
    <h3>内容を確認してください</h3>

    <div class="two-col field-block">
      <div>
        <label class="field-label" for="draft-customer">お客様名</label>
        <input type="text" id="draft-customer">
      </div>
      <div>
        <label class="field-label" for="draft-date">日付</label>
        <input type="date" id="draft-date">
      </div>
    </div>

    <div class="two-col field-block">
      <div>
        <label class="field-label" for="draft-temp">反応・温度感</label>
        <select id="draft-temp">
          <option value="前向き">前向き</option>
          <option value="様子見">様子見</option>
          <option value="懸念あり">懸念あり</option>
          <option value="不明">不明</option>
        </select>
      </div>
      <div>
        <label class="field-label" for="draft-stage">案件の進捗</label>
        <select id="draft-stage">
          <option value="初回接触">初回接触</option>
          <option value="検討中">検討中</option>
          <option value="見積提出中">見積提出中</option>
          <option value="受注">受注</option>
          <option value="失注">失注</option>
          <option value="不明">不明</option>
        </select>
      </div>
    </div>

    <div class="field-block">
      <label class="field-label" for="draft-summary">要約</label>
      <textarea id="draft-summary" style="min-height: 70px;"></textarea>
    </div>

    <div class="field-block">
      <label class="field-label" for="draft-concerns">懸念点・競合の話</label>
      <textarea id="draft-concerns" style="min-height: 50px;" placeholder="なければ空欄でOK"></textarea>
    </div>

    <div class="field-block">
      <label class="field-label">次にやること</label>
      <ul class="editable-list" id="draft-actions"></ul>
      <button type="button" class="add-line" data-target="actions">＋ 項目を追加</button>
    </div>

    <div class="field-block" id="ai-suggestion-block">
      <label class="field-label">AIからの次の一手の提案（気に入ったら「次にやること」へ追加できます）</label>
      <ul class="suggestion-list" id="ai-suggestions"></ul>
    </div>

    <div class="field-block">
      <label class="field-label" for="draft-reflection">気づき・振り返り（自分用メモ）</label>
      <textarea id="draft-reflection" style="min-height: 50px;" placeholder="うまくいった点、次は変えたい点など"></textarea>
    </div>

    <div class="field-block">
      <label class="field-label" for="draft-followup">今回フォローが必要な対応はありますか？</label>
      <select id="draft-followup">
        <option value="">なし</option>
        <option value="サンプル提出">サンプル提出（7日後にリマインド）</option>
        <option value="見積提出">見積提出（5日後にリマインド）</option>
        <option value="資料送付">資料送付（5日後にリマインド）</option>
        <option value="デモ実施">デモ実施（3日後にリマインド）</option>
        <option value="その他">その他（7日後にリマインド）</option>
      </select>
    </div>

    <button id="save-btn" class="btn-save">この内容で保存</button>
    <button id="discard-btn" class="btn-text">やり直す</button>
  </section>

  <section class="history-section">
    <div class="view-toggle-row">
      <h2 id="history-heading">顧客ごとの記録</h2>
      <div class="view-toggle">
        <button id="view-customer-btn" class="view-toggle-btn active">顧客ごと</button>
        <button id="view-date-btn" class="view-toggle-btn">日報（日付ごと）</button>
      </div>
    </div>
    <div id="customer-list">
      <div class="empty-note">まだ記録がありません。上のメモから最初の商談を記録しましょう。</div>
    </div>
  </section>

</div>

<script>
const FOLLOWUP_INTERVAL_DAYS = {
  'サンプル提出': 7, '見積提出': 5, '資料送付': 5, 'デモ実施': 3, 'その他': 7
};

const rawInput = document.getElementById('raw-input');
const summarizeBtn = document.getElementById('summarize-btn');
const statusMsg = document.getElementById('status-msg');
const draftCard = document.getElementById('draft-card');
const draftCustomer = document.getElementById('draft-customer');
const draftDate = document.getElementById('draft-date');
const draftTemp = document.getElementById('draft-temp');
const draftStage = document.getElementById('draft-stage');
const draftSummary = document.getElementById('draft-summary');
const draftConcerns = document.getElementById('draft-concerns');
const draftActions = document.getElementById('draft-actions');
const aiSuggestionsEl = document.getElementById('ai-suggestions');
const draftReflection = document.getElementById('draft-reflection');
const draftFollowup = document.getElementById('draft-followup');
const saveBtn = document.getElementById('save-btn');
const discardBtn = document.getElementById('discard-btn');
const customerList = document.getElementById('customer-list');
const alertSection = document.getElementById('alert-section');
const historyHeading = document.getElementById('history-heading');
const viewCustomerBtn = document.getElementById('view-customer-btn');
const viewDateBtn = document.getElementById('view-date-btn');
let historyViewMode = 'customer';
let cachedEntries = [];

viewCustomerBtn.addEventListener('click', () => {
  historyViewMode = 'customer';
  viewCustomerBtn.classList.add('active');
  viewDateBtn.classList.remove('active');
  historyHeading.textContent = '顧客ごとの記録';
  renderCustomerView(cachedEntries);
});
viewDateBtn.addEventListener('click', () => {
  historyViewMode = 'date';
  viewDateBtn.classList.add('active');
  viewCustomerBtn.classList.remove('active');
  historyHeading.textContent = '日報（日付ごと）';
  renderDateView(cachedEntries);
});

function todayStr() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function addDays(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function setStatus(text, isError) {
  statusMsg.textContent = text;
  statusMsg.className = 'status' + (isError ? ' error' : '');
}
function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// 記録の保存先。まずClaude内の保存機能を試し、使えない場合（例：GitHub Pagesなど
// 単体のWebページとして開いている場合）は、この端末のブラウザ内に保存する。
const hasCloudStorage = (typeof window.storage !== 'undefined') && !!window.storage;

async function storageSet(key, value) {
  if (hasCloudStorage) {
    try { return await window.storage.set(key, value, false); } catch (e) { /* フォールバックへ */ }
  }
  localStorage.setItem(key, value);
  return { key, value };
}
async function storageGet(key) {
  if (hasCloudStorage) {
    try { return await window.storage.get(key, false); } catch (e) { /* フォールバックへ */ }
  }
  const v = localStorage.getItem(key);
  if (v === null) throw new Error('not found');
  return { key, value: v };
}
async function storageList(prefix) {
  if (hasCloudStorage) {
    try { return await window.storage.list(prefix, false); } catch (e) { /* フォールバックへ */ }
  }
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.indexOf(prefix) === 0) keys.push(k);
  }
  return { keys };
}
async function storageDelete(key) {
  if (hasCloudStorage) {
    try { return await window.storage.delete(key, false); } catch (e) { /* フォールバックへ */ }
  }
  localStorage.removeItem(key);
  return { key, deleted: true };
}

function addEditableLine(listEl, value) {
  const li = document.createElement('li');
  const input = document.createElement('input');
  input.type = 'text';
  input.value = value || '';
  const removeBtn = document.createElement('button');
  removeBtn.type = 'button';
  removeBtn.className = 'remove-line';
  removeBtn.textContent = '削除';
  removeBtn.addEventListener('click', () => li.remove());
  li.appendChild(input);
  li.appendChild(removeBtn);
  listEl.appendChild(li);
}
document.querySelectorAll('.add-line').forEach(btn => {
  btn.addEventListener('click', () => addEditableLine(draftActions, ''));
});

function extractJson(text) {
  const cleaned = text.replace(/```json|```/g, '').trim();
  const start = cleaned.indexOf('{');
  const end = cleaned.lastIndexOf('}');
  if (start === -1 || end === -1) throw new Error('JSON not found');
  return JSON.parse(cleaned.slice(start, end + 1));
}

const WORKER_URL = 'https://long-shape-f8ed.takeshi610414m0207.workers.dev/';

async function summarize() {
  const text = rawInput.value.trim();
  if (!text) { setStatus('メモを入力してください。', true); return; }
  summarizeBtn.disabled = true;
  setStatus('まとめています…');

  const prompt = `あなたは営業の日報作成アシスタントです。以下は営業担当者が音声入力または文字起こしした商談メモです。
内容を読み取り、次のJSON形式のみで出力してください。前置き、説明、Markdownのコードブロックは一切つけないでください。

{"customerName": "顧客名（会社名や個人名。わからなければ「不明」）", "date": "YYYY-MM-DD形式の日付。メモ内に日付の手がかりがなければ空文字", "summary": "商談内容を2〜3文で要約したもの", "reactionTemperature": "前向き・様子見・懸念あり・不明のいずれか1つ", "dealStage": "初回接触・検討中・見積提出中・受注・失注・不明のいずれか1つ", "concerns": "懸念点や競合の話があれば。なければ空文字", "keyNextActions": ["メモから読み取れる次にやること"], "aiSuggestions": ["メモの内容を踏まえて、次にやるとよさそうな一手を1〜3個、具体的に"]}

メモ:
${text}`;

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt })
    });
    const data = await response.json();
    if (data.error) throw new Error(data.error);
    const parsed = extractJson(data.text || '');

    draftCustomer.value = parsed.customerName || '不明';
    draftDate.value = parsed.date || todayStr();
    draftTemp.value = ['前向き','様子見','懸念あり','不明'].includes(parsed.reactionTemperature) ? parsed.reactionTemperature : '不明';
    draftStage.value = ['初回接触','検討中','見積提出中','受注','失注','不明'].includes(parsed.dealStage) ? parsed.dealStage : '不明';
    draftSummary.value = parsed.summary || '';
    draftConcerns.value = parsed.concerns || '';

    draftActions.innerHTML = '';
    (parsed.keyNextActions || []).forEach(p => addEditableLine(draftActions, p));
    if ((parsed.keyNextActions || []).length === 0) addEditableLine(draftActions, '');

    aiSuggestionsEl.innerHTML = '';
    (parsed.aiSuggestions || []).forEach(s => {
      const li = document.createElement('li');
      const span = document.createElement('span');
      span.textContent = s;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'suggestion-add-btn';
      btn.textContent = '＋ 追加';
      btn.addEventListener('click', () => {
        addEditableLine(draftActions, s);
        btn.textContent = '追加済み';
        btn.classList.add('added');
      });
      li.appendChild(span);
      li.appendChild(btn);
      aiSuggestionsEl.appendChild(li);
    });

    draftReflection.value = '';
    draftFollowup.value = '';

    draftCard.classList.remove('hidden');
    setStatus('内容を確認して保存してください。');
  } catch (err) {
    console.error(err);
    setStatus('まとめに失敗しました。もう一度お試しください。', true);
  } finally {
    summarizeBtn.disabled = false;
  }
}
summarizeBtn.addEventListener('click', summarize);

discardBtn.addEventListener('click', () => {
  draftCard.classList.add('hidden');
  setStatus('');
});

saveBtn.addEventListener('click', async () => {
  const keyPoints = Array.from(draftActions.querySelectorAll('input')).map(i => i.value.trim()).filter(Boolean);
  const date = draftDate.value || todayStr();
  const followupType = draftFollowup.value;

  const entry = {
    customerName: draftCustomer.value.trim() || '不明',
    date,
    reactionTemperature: draftTemp.value,
    dealStage: draftStage.value,
    summary: draftSummary.value.trim(),
    concerns: draftConcerns.value.trim(),
    nextActions: keyPoints,
    reflection: draftReflection.value.trim(),
    followupType: followupType || null,
    followupDueDate: followupType ? addDays(date, FOLLOWUP_INTERVAL_DAYS[followupType]) : null,
    followupDone: false,
    savedAt: Date.now()
  };

  const key = `report:${entry.savedAt}`;
  try {
    const result = await storageSet(key, JSON.stringify(entry));
    if (!result) throw new Error('save failed');
    rawInput.value = '';
    draftCard.classList.add('hidden');
    setStatus('保存しました。');
    await loadHistory();
  } catch (err) {
    console.error(err);
    setStatus('保存に失敗しました。もう一度お試しください。', true);
  }
});

async function fetchAllEntries() {
  const listResult = await storageList('report:');
  const keys = (listResult && listResult.keys) || [];
  const entries = [];
  for (const key of keys) {
    try {
      const r = await storageGet(key);
      if (r && r.value) entries.push({ key, ...JSON.parse(r.value) });
    } catch (e) { /* skip unreadable entry */ }
  }
  entries.sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
  return entries;
}

function renderAlerts(entries) {
  const today = todayStr();
  const due = entries.filter(e => e.followupType && !e.followupDone && e.followupDueDate && e.followupDueDate <= today);
  if (due.length === 0) {
    alertSection.classList.add('hidden');
    alertSection.innerHTML = '';
    return;
  }
  alertSection.classList.remove('hidden');
  const box = document.createElement('div');
  box.className = 'alert-box';
  const h3 = document.createElement('h3');
  h3.textContent = `フォロー確認（${due.length}件）`;
  box.appendChild(h3);
  due.forEach(e => {
    const item = document.createElement('div');
    item.className = 'alert-item';
    const daysPast = Math.floor((new Date(today) - new Date(e.followupDueDate)) / 86400000);
    const pastText = daysPast > 0 ? `期限から${daysPast}日経過` : '本日が確認日です';
    const textDiv = document.createElement('div');
    textDiv.className = 'alert-text';
    textDiv.innerHTML = `<span class="cust">${escapeHtml(e.customerName)}</span>さん：${escapeHtml(e.followupType)}の${pastText}`;
    const doneBtn = document.createElement('button');
    doneBtn.className = 'alert-done-btn';
    doneBtn.textContent = '確認した';
    doneBtn.addEventListener('click', async () => {
      e.followupDone = true;
      await storageSet(e.key, JSON.stringify(e));
      await loadHistory();
    });
    item.appendChild(textDiv);
    item.appendChild(doneBtn);
    box.appendChild(item);
  });
  alertSection.innerHTML = '';
  alertSection.appendChild(box);
}

function tempTagClass(temp) {
  if (temp === '前向き') return 'tag temp-good';
  if (temp === '懸念あり') return 'tag temp-warn';
  return 'tag';
}

function entryItemHtml(e, showCustomerName) {
  const kpHtml = (e.nextActions || []).map(p => `<li>${escapeHtml(p)}</li>`).join('');
  return `
    <div class="entry-top-row">
      <div class="entry-date">${escapeHtml(e.date || '')}</div>
    </div>
    ${showCustomerName ? `<div class="date-entry-cust">${escapeHtml(e.customerName || '不明')}</div>` : ''}
    <div class="entry-tags">
      ${e.dealStage ? `<span class="tag stage">${escapeHtml(e.dealStage)}</span>` : ''}
      ${e.reactionTemperature ? `<span class="${tempTagClass(e.reactionTemperature)}">${escapeHtml(e.reactionTemperature)}</span>` : ''}
    </div>
    <div class="entry-summary">${escapeHtml(e.summary || '')}</div>
    ${e.concerns ? `<div class="entry-sub-label">懸念点・競合</div><div>${escapeHtml(e.concerns)}</div>` : ''}
    ${kpHtml ? `<div class="entry-sub-label">次にやること</div><ul>${kpHtml}</ul>` : ''}
    ${e.reflection ? `<div class="entry-sub-label">振り返り</div><div>${escapeHtml(e.reflection)}</div>` : ''}
    <button class="delete-entry" data-key="${escapeHtml(e.key)}">この記録を削除</button>
  `;
}

function wireDeleteButtons() {
  customerList.querySelectorAll('.delete-entry').forEach(btn => {
    btn.addEventListener('click', async () => {
      const key = btn.getAttribute('data-key');
      try { await storageDelete(key); await loadHistory(); }
      catch (e) { console.error(e); }
    });
  });
}

function renderCustomerView(entries) {
  if (entries.length === 0) {
    customerList.innerHTML = '<div class="empty-note">まだ記録がありません。上のメモから最初の商談を記録しましょう。</div>';
    return;
  }
  const byCustomer = {};
  entries.forEach(e => {
    const name = e.customerName || '不明';
    if (!byCustomer[name]) byCustomer[name] = [];
    byCustomer[name].push(e);
  });
  const customerNames = Object.keys(byCustomer).sort((a, b) =>
    (byCustomer[b][0].savedAt || 0) - (byCustomer[a][0].savedAt || 0)
  );

  customerList.innerHTML = '';
  customerNames.forEach(name => {
    const group = byCustomer[name];
    const details = document.createElement('details');
    details.className = 'customer-folder';
    const summary = document.createElement('summary');
    summary.innerHTML = `<span class="cust-name">${escapeHtml(name)}</span><span class="cust-count">${group.length}件</span>`;
    details.appendChild(summary);
    group.forEach(e => {
      const item = document.createElement('div');
      item.className = 'entry-item';
      item.innerHTML = entryItemHtml(e, false);
      details.appendChild(item);
    });
    customerList.appendChild(details);
  });
  wireDeleteButtons();
}

function renderDateView(entries) {
  if (entries.length === 0) {
    customerList.innerHTML = '<div class="empty-note">まだ記録がありません。上のメモから最初の商談を記録しましょう。</div>';
    return;
  }
  const byDate = {};
  entries.forEach(e => {
    const d = e.date || '日付不明';
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(e);
  });
  const dates = Object.keys(byDate).sort((a, b) => (a < b ? 1 : -1));

  customerList.innerHTML = '';
  dates.forEach((d, idx) => {
    const group = byDate[d];
    const details = document.createElement('details');
    details.className = 'date-folder';
    if (idx === 0) details.setAttribute('open', '');
    const stageCounts = {};
    group.forEach(e => { const s = e.dealStage || '不明'; stageCounts[s] = (stageCounts[s] || 0) + 1; });
    const stageSummary = Object.entries(stageCounts).map(([s, c]) => `${s}${c}件`).join(' / ');

    const summary = document.createElement('summary');
    summary.innerHTML = `<span class="date-title">${escapeHtml(d)}</span><span class="date-count">${group.length}件訪問</span>`;
    details.appendChild(summary);

    const summaryLine = document.createElement('div');
    summaryLine.className = 'entry-item';
    summaryLine.innerHTML = `<div class="entry-sub-label">本日のまとめ</div><div>${escapeHtml(stageSummary)}</div>`;
    details.appendChild(summaryLine);

    group.forEach(e => {
      const item = document.createElement('div');
      item.className = 'entry-item';
      item.innerHTML = entryItemHtml(e, true);
      details.appendChild(item);
    });
    customerList.appendChild(details);
  });
  wireDeleteButtons();
}

async function loadHistory() {
  try {
    const entries = await fetchAllEntries();
    cachedEntries = entries;
    renderAlerts(entries);
    if (historyViewMode === 'date') {
      renderDateView(entries);
    } else {
      renderCustomerView(entries);
    }
  } catch (err) {
    console.error(err);
    customerList.innerHTML = '<div class="empty-note">記録の読み込みに失敗しました。</div>';
  }
}

loadHistory();
</script>
